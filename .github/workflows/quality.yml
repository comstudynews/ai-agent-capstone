name: Cookbook code checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked --python 3.11 --group dev
      - name: Run tests
        run: uv run --python 3.11 python -m pytest -q
      - name: Run every lesson checkpoint
        run: |
          for recipe in $(seq 1 15); do
            uv run --python 3.11 python -m app.lesson "$recipe" >/dev/null
          done
  mcp-stdio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install MCP dependency group
        run: uv sync --locked --python 3.11 --extra agent
      - name: Execute real MCP Client-Server stdio exchange
        env:
          DEMO_ADMIN_KEY: ci-local-only-test-secret-123456
        run: uv run --python 3.11 --extra agent python -m app.mcp_client
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  database-integrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: agentdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d agentdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install integration dependencies
        run: uv sync --locked --python 3.11 --group dev --extra all
      - name: Wait for Qdrant
        run: curl --retry 15 --retry-delay 2 --retry-connrefused --fail http://127.0.0.1:6333/collections
      - name: Test actual Qdrant search and Postgres persistence
        env:
          INTEGRATION_SERVICES: "1"
        run: uv run --python 3.11 --extra all python -m pytest -q tests/test_live_services.py

  release-lockfiles:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[lockfile]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve pinned Python and frontend dependencies
        run: |
          uv lock --python 3.11
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Save reproducible dependency locks
        run: |
          git add uv.lock frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock course dependencies [lockfile]'
            git push origin HEAD:main
          fi
