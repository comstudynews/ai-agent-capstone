[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "steps*"]
exclude = ["tests*", "frontend*"]

[project]
name = "ai-agent-capstone"
version = "1.0.0"
description = "A progressive, fictional IT operations agent cookbook"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
agent = ["langchain>=1,<2", "langchain-openai>=1,<2", "langchain-mcp-adapters>=0.1,<1", "langgraph>=1,<2", "mcp>=1.15,<2"]
rag = ["langchain-qdrant>=1,<2", "langchain-openai>=1,<2", "qdrant-client>=1,<2"]
persistence = ["langgraph-checkpoint-postgres>=2,<4", "psycopg[binary,pool]>=3.2,<4"]
all = ["langchain>=1,<2", "langchain-openai>=1,<2", "langchain-mcp-adapters>=0.1,<1", "langgraph>=1,<2", "mcp>=1.15,<2", "langchain-qdrant>=1,<2", "qdrant-client>=1,<2", "langgraph-checkpoint-postgres>=2,<4", "psycopg[binary,pool]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
